<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0a0e14;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#e8eef5}
  .bg{position:absolute;inset:0;background:
    radial-gradient(900px 600px at 78% 40%, rgba(255,77,79,.22), transparent 60%),
    radial-gradient(800px 520px at 20% 80%, rgba(46,204,113,.16), transparent 60%),
    radial-gradient(700px 500px at 60% 90%, rgba(241,196,15,.10), transparent 60%),
    #0a0e14}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(1200px 700px at 50% 50%,#000 40%,transparent 100%)}
  .wave{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:.9}
  .brand{position:absolute;left:120px;top:110px}
  .brand h1{margin:0;font-size:120px;letter-spacing:6px;font-weight:800;line-height:1}
  .brand h1 span{color:#ff4d4f}
  .brand p{margin:22px 0 0;font-size:40px;color:#9fb0c3;font-weight:400;max-width:1100px;line-height:1.25}
  .tiers{position:absolute;left:120px;bottom:160px;display:flex;gap:28px}
  .tier{padding:18px 28px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:30px;font-weight:600;display:flex;align-items:center;gap:16px}
  .dot{width:20px;height:20px;border-radius:50%}
  .foot{position:absolute;right:120px;top:1000px;transform:translateY(-100%);text-align:right;font-size:26px;color:#8a98a8;line-height:1.5}
  .shield{position:absolute;right:160px;top:140px;width:520px;height:600px}
</style></head><body>
<div class="bg"></div><div class="grid"></div>

  <path d="M0 300 C120 300 140 260 200 260 S300 330 360 330 S440 180 520 180 S600 340 680 340 S760 120 840 120 S920 360 1000 360 S1080 90 1160 90 S1240 380 1320 380 S1400 60 1480 60 S1560 400 1640 400 S1720 160 1800 160 S1880 300 1920 300" fill="none" stroke="url(#g)" stroke-width="4" opacity=".85"/>
  <path d="M0 300 C120 300 140 260 200 260 S300 330 360 330 S440 180 520 180 S600 340 680 340 S760 120 840 120 S920 360 1000 360 S1080 90 1160 90 S1240 380 1320 380 S1400 60 1480 60 S1560 400 1640 400 S1720 160 1800 160 S1880 300 1920 300 L1920 420 L0 420 Z" fill="url(#g)" opacity=".07"/>
</svg>

    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#2ecc71"/><stop offset=".5" stop-color="#f1c40f"/><stop offset="1" stop-color="#ff4d4f"/></linearGradient>
  </defs>
  <path d="M260 20 L470 90 V300 C470 430 370 520 260 580 C150 520 50 430 50 300 V90 Z" fill="url(#s)" stroke="url(#r)" stroke-width="6"/>
  <path d="M260 60 L435 118 V300 C435 405 355 480 260 535 C165 480 85 405 85 300 V118 Z" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
  <g stroke-linecap="round" stroke-width="14">
    <line x1="150" y1="300" x2="150" y2="300" stroke="#2ecc71"><animate attributeName="y1" values="300;250;300" dur="1s" repeatCount="indefinite"/><animate attributeName="y2" values="300;350;300" dur="1s" repeatCount="indefinite"/></line>
    <line x1="190" y1="260" x2="190" y2="340" stroke="#2ecc71"/>
    <line x1="230" y1="230" x2="230" y2="370" stroke="#f1c40f"/>
    <line x1="270" y1="200" x2="270" y2="400" stroke="#f1c40f"/>
    <line x1="310" y1="240" x2="310" y2="360" stroke="#ff4d4f"/>
    <line x1="350" y1="270" x2="350" y2="330" stroke="#ff4d4f"/>
    <line x1="390" y1="290" x2="390" y2="310" stroke="#ff4d4f"/>
  </g>
  <line x1="120" y1="440" x2="400" y2="440" stroke="#ff4d4f" stroke-width="6" stroke-linecap="round"/>
  <text x="260" y="490" text-anchor="middle" font-size="34" font-weight="700" fill="#ff4d4f" font-family="-apple-system,Helvetica,Arial" letter-spacing="4">CALL ENDED</text>
</svg>
<div class="brand">
  <h1>SCAM <span>SHIELD</span></h1>

</div>
<div class="tiers">

  <div class="tier"><span class="dot" style="background:#f1c40f"></span>Amber: redirect to a secure line</div>
  <div class="tier"><span class="dot" style="background:#2ecc71"></span>Green: nothing to do</div>
</div>
<div class="foot" style="top:auto;bottom:40px;transform:none;font-size:22px">Money Talks 2 &middot; Trust &amp; Risk &middot; PRISM &middot; Nicrron &middot; ElevenLabs</div>
</body></html>
