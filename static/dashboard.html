<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Shield</title>
<style>
  :root { --bg:#0b0f14; --panel:#121923; --text:#e8eef5; --muted:#8a98a8; --safe:#2ecc71; --warn:#f1c40f; --fraud:#ff4d4f; --caller:#ff9f43; --user:#54a0ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid #1f2a37; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  #status { color:var(--muted); font-size:14px; }
  main { display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; padding:16px 24px; height:calc(100vh - 60px); }
  .panel { background:var(--panel); border-radius:12px; padding:16px; overflow:auto; }
  #transcript .line { padding:6px 10px; margin:4px 0; border-radius:8px; }
  #transcript .CALLER { border-left:4px solid var(--caller); }
  #transcript .USER { border-left:4px solid var(--user); }
  #transcript .partial { opacity:.5; font-style:italic; }
  .who { font-size:12px; color:var(--muted); margin-right:8px; }
  #tier { font-size:64px; font-weight:800; text-align:center; padding:24px 0 8px; letter-spacing:2px; }
  #tier.SAFE { color:var(--safe);} #tier.UNCERTAIN { color:var(--warn);} #tier.FRAUD { color:var(--fraud); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .gauge { height:18px; background:#1f2a37; border-radius:9px; overflow:hidden; margin:0 0 16px; }
  .gauge > div { height:100%; width:0; background:linear-gradient(90deg,var(--safe),var(--warn),var(--fraud)); transition:width .4s; }
  .kv { display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin:4px 0; }
  .kv b { color:var(--text); }
  h3 { margin:18px 0 8px; font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:1px; }
  .fired { padding:8px 10px; margin:6px 0; border-radius:8px; background:#1a2230; font-size:14px; }
  .fired.dispositive { border-left:4px solid var(--fraud); } .fired.strong { border-left:4px solid #ff7a45; }
  .fired.moderate { border-left:4px solid var(--warn); } .fired.weak { border-left:4px solid var(--muted); }
  .fired .q { color:var(--muted); font-style:italic; display:block; }
  #alert { display:none; background:var(--fraud); color:#fff; padding:14px; border-radius:10px; font-weight:700; margin:12px 0; }
  button { background:#1f2a37; color:var(--text); border:1px solid #2c3a4b; padding:8px 14px; border-radius:8px; cursor:pointer; }
  @media (max-width:900px) { main { grid-template-columns:1fr; height:auto; } }
</style>
</head>
<body>
<header>
  <h1>SCAM SHIELD</h1>
  <div id="status">waiting for call</div>
</header>
<main>
  <section class="panel" id="transcript"></section>
  <section class="panel">
    <div id="tier" class="SAFE">SAFE</div>
    <div class="gauge"><div id="bar"></div></div>
    <div class="kv"><span>Score</span><b id="score">0</b></div>
    <div class="kv"><span>Archetype</span><b id="arch">none</b></div>
    <div class="kv"><span>Decision source</span><b id="src">-</b></div>
    <div class="kv"><span>Latency (utterance to score)</span><b id="lat">-</b></div>
    <div class="kv"><span>Trace</span><b id="trace">-</b></div>
    <div id="alert"></div>
    <h3>Fired criteria</h3>
    <div id="fired"></div>
    <h3>Legitimacy evidence</h3>
    <div id="neg"></div>
    <div style="margin-top:18px"><button id="notscam">Not a scam</button></div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  let traceId = null, partialEls = {};
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/dashboard`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  function handle(ev) {
    if (ev.type === 'status') { $('status').textContent = ev.text; if (ev.text.startsWith('Inbound')) reset(); }
    if (ev.type === 'partial') {
      let el = partialEls[ev.speaker];
      if (!el) { el = document.createElement('div'); el.className = `line partial ${ev.speaker}`; $('transcript').appendChild(el); partialEls[ev.speaker] = el; }
      el.innerHTML = `<span class="who">${ev.speaker}</span>${esc(ev.text)}`; scroll();
    }
    if (ev.type === 'turn') {
      const p = partialEls[ev.speaker]; if (p) { p.remove(); delete partialEls[ev.speaker]; }
      const el = document.createElement('div'); el.className = `line ${ev.speaker}`;
      el.innerHTML = `<span class="who">${ev.turn} ${ev.speaker}</span>${esc(ev.text)}`; $('transcript').appendChild(el); scroll();
    }
    if (ev.type === 'score') {
      traceId = ev.trace_id || traceId;
      $('tier').textContent = ev.tier; $('tier').className = ev.tier;
      $('bar').style.width = Math.min(100, ev.score) + '%';
      $('score').textContent = ev.score; $('arch').textContent = ev.archetype || 'none';
      $('src').textContent = ev.source === 'guardrail' ? 'PRISM guardrail (blocked)' : 'model via Nicrron';
      $('lat').textContent = Math.round(ev.latency_ms) + ' ms'; $('trace').textContent = traceId;
      $('fired').innerHTML = (ev.fired || []).map(f => `<div class="fired ${f.class||'weak'}">${esc(f.criterion)}<span class="q">"${esc(f.quote||'')}"</span></div>`).join('') || '<div class="fired weak">none</div>';
      $('neg').innerHTML = (ev.negatives || []).map(f => `<div class="fired weak" style="border-left-color:var(--safe)">${esc(f.criterion)}<span class="q">"${esc(f.quote||'')}"</span></div>`).join('') || '<div class="fired weak">none</div>';
    }
    if (ev.type === 'alert') { $('alert').style.display = 'block'; $('alert').textContent = 'WARNING PLAYED: ' + (ev.user_action || 'Hang up.'); }
  }
  function reset() { $('transcript').innerHTML = ''; $('alert').style.display = 'none'; $('tier').textContent='SAFE'; $('tier').className='SAFE'; $('bar').style.width='0'; $('fired').innerHTML=''; $('neg').innerHTML=''; partialEls = {}; }
  function scroll() { $('transcript').scrollTop = $('transcript').scrollHeight; }
  function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  $('notscam').onclick = () => ws.send(JSON.stringify({type:'feedback', trace_id: traceId}));
</script>
</body>
</html>
